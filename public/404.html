<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Akademi</title>
    <script>
      // GitHub Pages 404 redirect trick for React Router
      var segmentCount = 1; // /akademi/ = 1 segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
